<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuka - Trợ lý kế toán</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #7c3aed;
  --accent-dark: #6d28d9;
  --bg: linear-gradient(135deg, #faf8ff 0%, #f0ebff 50%, #e8f0fe 100%);
  --bot-msg: #ffffff;
  --bot-border: #e5dff5;
  --user-msg: linear-gradient(135deg, #7c3aed, #6d28d9);
  --text: #1a1a2e;
  --text-light: #6b7280;
  --green: #22c55e; --purple: #7c3aed; --red: #ef4444;
  --orange: #f59e0b; --blue: #3b82f6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); height:100vh; overflow:hidden; display:flex; justify-content:center; }
.chat {
  width:100%; max-width:600px; height:100vh;
  display:flex; flex-direction:column; background:rgba(255,255,255,0.3);
}
.header {
  padding:14px 20px; background:var(--accent); color:#fff;
  font-size:17px; font-weight:700; display:flex; align-items:center; gap:10px;
  flex-shrink:0;
}
.header .dot { width:8px;height:8px;background:#4ade80;border-radius:50%; }
.messages {
  flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
  scroll-behavior:smooth;
}
.msg {
  max-width:85%; padding:10px 14px; font-size:14px; line-height:1.6;
  white-space:pre-wrap; word-break:break-word; animation:fadeIn .2s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.msg.bot {
  align-self:flex-start; background:var(--bot-msg); color:var(--text);
  border-radius:4px 14px 14px 14px; border:1px solid var(--bot-border);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.msg.bot.card { border-left:3px solid var(--accent); background:linear-gradient(135deg,#f8f5ff,#fff); }
.msg.user {
  align-self:flex-end; background:var(--user-msg); color:#fff;
  border-radius:14px 4px 14px 14px; box-shadow:0 2px 6px rgba(124,58,237,.2);
}
.msg img.preview { max-width:180px;max-height:240px;border-radius:8px;display:block; }

/* Button groups - hiện cùng 1 khung */
.btn-group {
  align-self:flex-start; max-width:90%; padding:12px 16px;
  background:var(--bot-msg); border:1px solid var(--bot-border); border-left:3px solid var(--accent);
  border-radius:4px 14px 14px 14px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  animation:fadeIn .25s ease;
}
.btn-group-label { font-size:12px; font-weight:700; color:var(--accent); margin:10px 0 6px; }
.btn-group-label:first-child { margin-top:0; }
.btn-group-options { display:flex; flex-wrap:wrap; gap:5px; }
.btn-group-selected { font-size:12px; color:var(--green); margin:4px 0 0; font-weight:600; }

/* Inline buttons */
.msg-buttons { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; animation:fadeIn .2s ease; }
.btn {
  padding:7px 14px; border:none; border-radius:8px; font-size:12px; font-weight:600;
  cursor:pointer; transition:all .15s; color:#fff; font-family:'Inter',sans-serif;
}
.btn:hover { filter:brightness(1.1);transform:translateY(-1px); }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.4;cursor:default;transform:none;filter:none; }
.btn.green{background:var(--green)} .btn.purple{background:var(--purple)}
.btn.red{background:var(--red)} .btn.orange{background:var(--orange)}
.btn.blue{background:var(--blue)}

.bottom {
  padding:12px 16px; border-top:1px solid rgba(124,58,237,.08);
  background:rgba(255,255,255,.8); backdrop-filter:blur(8px); flex-shrink:0;
}
.input-row {
  display:flex; gap:6px; align-items:center; background:#fff;
  border:1.5px solid #e0d4f5; border-radius:24px; padding:3px 3px 3px 12px;
  transition:border-color .2s;
}
.input-row:focus-within { border-color:var(--accent); }
.input-row input {
  flex:1; border:none; outline:none; font-size:14px; background:transparent;
  color:var(--text); padding:8px 0; font-family:'Inter',sans-serif;
}
.input-row input::placeholder { color:#a0a0b0; }
.icon-btn {
  width:36px;height:36px;border-radius:50%;border:none;background:transparent;
  color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.icon-btn:hover { background:#f0ebff; }
.icon-btn svg { width:20px;height:20px;fill:var(--accent); }
.send-btn {
  width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.send-btn:hover { background:var(--accent-dark); }
.send-btn:disabled { background:#c4b5fd;cursor:not-allowed; }
.send-btn svg { width:16px;height:16px;fill:#fff; }
.hint { text-align:center;font-size:11px;color:var(--text-light);margin-top:6px; }
.typing {
  align-self:flex-start;padding:10px 14px;background:var(--bot-msg);border:1px solid var(--bot-border);
  border-radius:4px 14px 14px 14px;font-size:16px;color:var(--text-light);display:flex;gap:3px;
}
.typing span { animation:blink 1.4s infinite; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,60%,100%{opacity:.2} 30%{opacity:1} }
</style>
</head>
<body>
<div class="chat">
  <div class="header"><span class="dot"></span> Xuka - Trợ lý kế toán</div>
  <div class="messages" id="messages"></div>
  <div class="bottom">
    <div class="input-row">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload hình">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
      <input type="text" id="textInput" placeholder="Nhập tin nhắn hoặc paste hình...">
      <button class="send-btn" id="sendBtn" onclick="sendText()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="hint">Paste (Ctrl+V) hoặc upload hình chuyển khoản</div>
  </div>
</div>

<script>
let S = "IDLE", D = {}, processing = false;
const msgs = document.getElementById("messages");
const input = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

showWelcome();

function showWelcome() {
  addBot("Xin chào! Tôi là Xuka - trợ lý kế toán.\nChọn Thu hoặc Chi, hoặc paste hình chuyển khoản.");
  showStart();
}

function showStart() {
  const w = mkBtnWrap();
  w.appendChild(mkBtn("Ghi Thu","green",()=>{addUser("Ghi Thu");api("start_thu","")}));
  w.appendChild(mkBtn("Ghi Chi","purple",()=>{addUser("Ghi Chi");api("start_chi","")}));
  msgs.appendChild(w); scroll();
}

function mkBtnWrap() { const d=document.createElement("div");d.className="msg-buttons";return d; }
function mkBtn(t,c,fn) {
  const b=document.createElement("button");b.className="btn "+c;b.textContent=t;b.onclick=fn;return b;
}

function addBot(t,card) {
  const d=document.createElement("div");d.className="msg bot"+(card?" card":"");d.textContent=t;
  msgs.appendChild(d); scroll();
}
function addUser(t) {
  const d=document.createElement("div");d.className="msg user";d.textContent=t;
  msgs.appendChild(d); scroll();
}
function addUserImg(src) {
  return new Promise(resolve => {
    const d=document.createElement("div");d.className="msg user";
    const img=document.createElement("img");img.className="preview";
    img.onload=()=>{msgs.appendChild(d);scroll();resolve();};
    img.src=src; d.appendChild(img);
  });
}
function scroll() { requestAnimationFrame(()=>{msgs.scrollTop=msgs.scrollHeight}); }

function showTyping() {
  const d=document.createElement("div");d.className="typing";d.id="typing";
  d.innerHTML="<span>.</span><span>.</span><span>.</span>";msgs.appendChild(d);scroll();
}
function hideTyping() { document.getElementById("typing")?.remove(); }

function disableAll() {
  msgs.querySelectorAll(".btn:not([disabled])").forEach(b=>{b.disabled=true;b.onclick=null;});
}

function btnColor(t,i) {
  if(t.startsWith("Xác nhận"))return"green";
  if(t.startsWith("Hủy")||t.startsWith("Bỏ qua"))return"red";
  if(t.startsWith("Sửa"))return"orange";
  return["blue","purple","green","orange"][i%4];
}

function renderButtons(buttons,action) {
  const w=mkBtnWrap();
  buttons.forEach((t,i)=>{
    w.appendChild(mkBtn(t,btnColor(t,i),()=>{addUser(t);disableAll();api(action,t);}));
  });
  msgs.appendChild(w);scroll();
}

function renderButtonGroups(groups) {
  const box=document.createElement("div");box.className="btn-group";

  groups.forEach(g=>{
    const lbl=document.createElement("div");lbl.className="btn-group-label";lbl.textContent=g.label;
    box.appendChild(lbl);

    const opts=document.createElement("div");opts.className="btn-group-options";
    g.options.forEach((opt,i)=>{
      const b=mkBtn(opt,btnColor(opt,i),()=>{
        // Disable this group's buttons
        opts.querySelectorAll(".btn").forEach(x=>{x.disabled=true;x.onclick=null;});
        // Show selected
        const sel=document.createElement("div");sel.className="btn-group-selected";
        sel.textContent="✓ "+opt;
        opts.after(sel);
        // Send to backend
        api(g.action,opt);
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
  });

  msgs.appendChild(box);
  // Ensure scroll to bottom so buttons are visible
  setTimeout(scroll, 50);
  setTimeout(scroll, 200);
}

function sendText() {
  const t=input.value.trim();if(!t||processing)return;
  addUser(t);input.value="";api("input_text",t);
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendText()});

// Paste image - auto send immediately
document.addEventListener("paste",e=>{
  const items=e.clipboardData?.items;if(!items)return;
  for(const item of items){
    if(item.type.startsWith("image/")){
      e.preventDefault();
      const file=item.getAsFile();
      if(file) uploadImage(file);
      return;
    }
  }
});
function handleFileUpload(e){const f=e.target.files[0];if(f)uploadImage(f);e.target.value="";}

async function uploadImage(file) {
  if(processing)return;
  processing=true; sendBtn.disabled=true;

  // 1. Show image preview FIRST
  const dataUrl = await new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(file);});
  await addUserImg(dataUrl);

  // 2. THEN show typing indicator (after user message)
  showTyping();

  // 3. Send to backend
  try {
    const fd=new FormData();fd.append("file",file);
    const res=await fetch("/api/upload",{method:"POST",body:fd});
    const data=await res.json();
    hideTyping();
    handleResponse(data);
  } catch(err){
    hideTyping();
    addBot("Lỗi khi upload hình. Vui lòng thử lại.");
    setTimeout(showStart,600);
  }
  processing=false; sendBtn.disabled=false;
}

async function api(action,inp) {
  if(processing)return;
  processing=true; sendBtn.disabled=true;
  showTyping();
  try {
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action,state:S,data:D,input:inp})});
    const data=await res.json();
    hideTyping();
    handleResponse(data);
  } catch(err){hideTyping();addBot("Lỗi kết nối.");setTimeout(showStart,600);}
  processing=false; sendBtn.disabled=false;
}

function handleResponse(data) {
  S=data.state; D=data.data;
  data.messages.forEach(m=>{
    const card=m.text.includes("\n")&&(m.text.includes(":")||m.text.includes("-"));
    addBot(m.text,card);
  });
  if(data.done){S="IDLE";D={};setTimeout(showStart,600);return;}

  if(data.button_groups&&data.button_groups.length>0) renderButtonGroups(data.button_groups);
  if(data.buttons&&data.buttons.length>0) renderButtons(data.buttons,data.button_action||"select_button");
  if(data.show_input){input.placeholder=data.input_placeholder||"Nhập tin nhắn...";input.value="";input.focus();}
}
</script>
</body>
</html>
