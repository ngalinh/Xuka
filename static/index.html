<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Kế Toán Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#6C47FF;--bg:#F7F7F8;--white:#fff;--g1:#F0F0F3;--g2:#E0E0E5;--g3:#94949E;--text:#1A1A1E;--green:#00C853;--yellow:#FFB300;--red:#FF3B30}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);height:100vh;overflow:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:var(--white)}
.hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--g1);flex-shrink:0}
.hdr-av{width:38px;height:38px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center}
.hdr-av svg{width:22px;height:22px;fill:var(--white)}
.hdr-info{flex:1}.hdr-name{font-size:15px;font-weight:700;color:var(--text)}.hdr-st{font-size:11px;color:var(--green);font-weight:500}
.msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;font-size:13px;line-height:1.55;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--g1);color:var(--text);padding:10px 14px;border-radius:4px 16px 16px 16px}
.msg.usr{align-self:flex-end;background:var(--pri);color:var(--white);padding:10px 14px;border-radius:16px 4px 16px 16px}
.msg img{max-width:160px;max-height:200px;border-radius:8px;display:block}

/* Card */
.card{align-self:flex-start;width:95%;background:#FAFAFE;border:1px solid var(--g2);border-radius:12px;animation:fi .25s ease}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g1);background:var(--white);border-radius:12px 12px 0 0}
.card-date{font-size:12px;font-weight:600;color:var(--text)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;color:var(--white)}
.badge.hi{background:var(--green)}.badge.lo{background:var(--yellow);color:var(--text)}.badge.no{background:var(--g3)}
.card-body{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.card-row{display:flex;align-items:center;gap:8px;font-size:12px;min-height:28px}
.card-label{width:78px;flex-shrink:0;color:var(--g3);font-weight:600}
.card-val{flex:1;color:var(--text);font-weight:500}
.card-val.amount{font-size:14px;font-weight:700;color:var(--red)}
.card-val.amount.thu{color:var(--green)}
.card-actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--g1);background:var(--white);border-radius:0 0 12px 12px}
.card-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.card-btn:hover{filter:brightness(.95)}.card-btn:disabled{opacity:.6;cursor:not-allowed}
.card-btn.save{background:var(--pri);color:var(--white)}.card-btn.skip{background:var(--g1);color:var(--g3)}

/* Dropdown Select Button */
.sel-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;color:var(--white);background:var(--pri);font-family:'Inter',sans-serif;position:relative}
.sel-btn.empty{background:var(--g2);color:var(--g3)}
.sel-btn .arrow{font-size:9px;margin-left:2px}
/* Dropdown panel */
.sel-panel{display:none;position:fixed;background:var(--white);border:1px solid var(--g2);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;z-index:9999;min-width:200px;max-width:280px}
.sel-panel.open{display:block}
.sel-panel-title{padding:8px 14px;font-size:11px;font-weight:700;color:var(--g3);text-transform:uppercase;border-bottom:1px solid var(--g1);position:sticky;top:0;background:var(--white)}
.sel-item{padding:9px 14px;font-size:12px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--g1)}
.sel-item:last-child{border-bottom:none}
.sel-item:hover{background:#F0EDFF;color:var(--pri)}
.sel-item.active{background:var(--pri);color:var(--white)}

/* Image preview in input area */
.preview-bar{display:none;padding:8px 12px;border-top:1px solid var(--g1);background:var(--white);flex-shrink:0;overflow-x:auto;white-space:nowrap}
.preview-bar.show{display:flex;gap:8px;align-items:center}
.preview-thumb{position:relative;display:inline-block;flex-shrink:0}
.preview-thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid var(--g2)}
.preview-thumb .x{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--red);color:var(--white);border:none;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

/* Batch */
.batch-hdr{align-self:flex-start;width:95%;padding:10px 14px;background:#FAFAFE;border:1px solid var(--g2);border-radius:12px 12px 0 0;border-bottom:none;animation:fi .25s ease}
.batch-hdr h4{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
.batch-section{margin-bottom:6px}
.batch-section-label{font-size:10px;font-weight:700;color:var(--g3);text-transform:uppercase;margin-bottom:4px}
.batch-items{align-self:flex-start;width:95%;border:1px solid var(--g2);border-radius:0 0 12px 12px;overflow:hidden}
.batch-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--g1);background:var(--white)}
.batch-item:last-child{border-bottom:none}
.batch-item-name{flex:1;font-size:12px;font-weight:600;color:var(--text)}
.batch-item-amt{font-size:13px;font-weight:700;color:var(--red)}
.batch-total{display:flex;justify-content:space-between;padding:10px 14px;background:var(--g1);font-size:13px;font-weight:700}
.batch-actions{display:flex;gap:8px;padding:10px 14px;background:var(--white)}

/* Input */
.input-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--g1);flex-shrink:0;background:var(--white)}
.input-wrap{flex:1;display:flex;align-items:center;gap:6px;background:var(--g1);border-radius:20px;padding:4px 4px 4px 12px}
.input-wrap input{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:var(--text);padding:6px 0;font-family:'Inter',sans-serif}
.input-wrap input::placeholder{color:var(--g3)}
.ib{width:32px;height:32px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib svg{width:18px;height:18px;fill:var(--g3)}.ib:hover svg{fill:var(--pri)}
.sb{width:32px;height:32px;border-radius:50%;border:none;background:var(--pri);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb svg{width:14px;height:14px;fill:var(--white)}.sb:disabled{background:var(--g2);cursor:not-allowed}
.hint{text-align:center;font-size:10px;color:var(--g3);padding:4px 12px 8px;background:var(--white)}
.typing{align-self:flex-start;padding:10px 14px;background:var(--g1);border-radius:4px 16px 16px 16px;display:flex;gap:3px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--g3);animation:bk 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bk{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* Lightbox */
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:10000;align-items:center;justify-content:center;cursor:pointer}
.lightbox.open{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.lightbox .close-lb{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-av"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
    <div class="hdr-info"><div class="hdr-name">Kế Toán Bot</div><div class="hdr-st">đang hoạt động</div></div>
  </div>
  <div class="msgs" id="M"></div>
  <div class="preview-bar" id="pbar"></div>
  <div class="input-bar">
    <div class="input-wrap">
      <button class="ib" onclick="document.getElementById('fi').click()"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
      <input type="file" id="fi" accept="image/*" multiple style="display:none" onchange="onFiles(event)">
      <input type="text" id="ti" placeholder="Nhập ghi chú hoặc paste hình...">
    </div>
    <button class="sb" id="sb" onclick="onSend()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
  <div class="hint">Paste hình → thêm ghi chú → Enter gửi</div>
</div>
<!-- Dropdown panel -->
<div class="sel-panel" id="selPanel"></div>
<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <span class="close-lb">&times;</span>
  <img id="lbImg" src="">
</div>

<script>
var M=document.getElementById("M"),ti=document.getElementById("ti"),sb=document.getElementById("sb"),pbar=document.getElementById("pbar"),selPanel=document.getElementById("selPanel");
var opts={},pendingFiles=[],pendingDataUrls=[],busy=false;

function loadOptions(){
  fetch("/api/options").then(function(r){return r.json()}).then(function(d){
    if(d&&d.nganh_nghe){opts=d;console.log("Options loaded:",Object.keys(d).map(function(k){return k+":"+d[k].length}))}
  }).catch(function(){setTimeout(loadOptions,3000)});
}
loadOptions();
botMsg("Xin chào! Gửi hình chuyển khoản để ghi nhận.\nPaste hình → thêm ghi chú → Enter.");

function $el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e}
function botMsg(t){var d=$el("div","msg bot");d.textContent=t;M.appendChild(d);scr()}
function usrMsg(t){var d=$el("div","msg usr");d.textContent=t;M.appendChild(d);scr()}
function usrImg(src){var d=$el("div","msg usr");var img=document.createElement("img");img.src=src;img.style.cursor="pointer";img.addEventListener("click",function(){document.getElementById("lbImg").src=src;document.getElementById("lightbox").classList.add("open")});d.appendChild(img);M.appendChild(d);scr()}
function scr(){requestAnimationFrame(function(){M.scrollTop=M.scrollHeight})}
function showTyping(){var d=$el("div","typing");d.id="typ";d.innerHTML="<span></span><span></span><span></span>";M.appendChild(d);scr()}
function hideTyping(){var e=document.getElementById("typ");if(e)e.remove()}

// =====================
// IMAGE PREVIEW IN INPUT BAR (like Messenger)
// =====================
function addPendingImage(file){
  pendingFiles.push(file);
  var reader=new FileReader();
  reader.onload=function(ev){
    var dataUrl=ev.target.result;
    pendingDataUrls.push(dataUrl);
    renderPreviews();
  };
  reader.readAsDataURL(file);
}

function renderPreviews(){
  pbar.innerHTML="";
  if(pendingFiles.length===0){pbar.className="preview-bar";return}
  pbar.className="preview-bar show";
  for(var i=0;i<pendingDataUrls.length;i++){
    (function(idx){
      var thumb=$el("div","preview-thumb");
      var img=document.createElement("img");img.src=pendingDataUrls[idx];
      var xBtn=$el("button","x");xBtn.textContent="×";
      xBtn.addEventListener("click",function(){
        pendingFiles.splice(idx,1);
        pendingDataUrls.splice(idx,1);
        renderPreviews();
      });
      thumb.appendChild(img);thumb.appendChild(xBtn);
      pbar.appendChild(thumb);
    })(i);
  }
}

// Paste → preview in input bar
document.addEventListener("paste",function(e){
  var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf("image")!==-1){
      e.preventDefault();
      var f=items[i].getAsFile();
      if(f)addPendingImage(f);
      return;
    }
  }
});

function onFiles(e){
  var fl=e.target.files;
  for(var i=0;i<fl.length;i++)addPendingImage(fl[i]);
  e.target.value="";
}

// =====================
// SEND
// =====================
var composing=false;
ti.addEventListener("compositionstart",function(){composing=true});
ti.addEventListener("compositionend",function(){composing=false});
ti.addEventListener("keydown",function(e){if(e.key==="Enter"&&!composing){e.preventDefault();onSend()}});

// Main send function
onSend=function(){
  if(window._waitingAmount){handleAmountInput();return}
  var note=ti.value.trim();
  ti.value="";

  if(pendingFiles.length>0){
    // Show images + note in chat
    for(var i=0;i<pendingDataUrls.length;i++)usrImg(pendingDataUrls[i]);
    if(note)usrMsg(note);
    // Save files before clearing
    var filesToSend=pendingFiles.slice();
    pendingFiles=[];pendingDataUrls=[];renderPreviews();
    if(busy)return;busy=true;sb.disabled=true;
    // Send each image as separate request (avoids Render 30s timeout)
    processOneByOne(filesToSend,note,0);
  }else if(note){
    usrMsg(note);
    manualEntry(note);
  }
};

function processOneByOne(files,note,idx){
  if(idx>=files.length){busy=false;sb.disabled=false;return}
  var total=files.length;
  if(total>1)botMsg("Đang xử lý ảnh "+(idx+1)+"/"+total+"...");
  showTyping();
  var fd=new FormData();
  fd.append("files",files[idx]);
  fd.append("note",note||"");
  fetch("/api/process",{method:"POST",body:fd})
    .then(function(r){return r.json()})
    .then(function(data){
      hideTyping();
      if(data.options&&data.options.nganh_nghe)opts=data.options;
      if(data.entries&&data.entries.length>0){
        data.entries.forEach(function(entry){renderCard(entry)});
      }else{
        botMsg("Không đọc được ảnh "+(idx+1));
      }
      // Process next image
      processOneByOne(files,note,idx+1);
    })
    .catch(function(err){
      hideTyping();
      botMsg("Lỗi ảnh "+(idx+1)+": "+(err.message||err));
      processOneByOne(files,note,idx+1);
    });
}

function manualEntry(note){
  if(busy)return;busy=true;sb.disabled=true;showTyping();
  var fd=new FormData();fd.append("note",note);
  fetch("/api/chat",{method:"POST",body:fd})
    .then(function(r){return r.json()})
    .then(function(data){
      hideTyping();if(data.options)opts=data.options;
      botMsg("Nhập số tiền (VNĐ):");
      window._manualEntry=data.entry;window._waitingAmount=true;
      busy=false;sb.disabled=false;
    })
    .catch(function(err){hideTyping();botMsg("Lỗi: "+err);busy=false;sb.disabled=false});
}

function handleAmountInput(){
  var t=ti.value.trim();if(!t)return;
  usrMsg(t);ti.value="";
  var c=t.toLowerCase(),m=1;
  if(c.endsWith("k")){c=c.slice(0,-1);m=1000}
  c=c.replace(/[,.]/g,"");
  if(!/^\d+$/.test(c)||parseInt(c)<=0){botMsg("Số tiền không hợp lệ, nhập lại:");return}
  window._waitingAmount=false;
  var entry=window._manualEntry;
  entry.ocr.so_tien=parseInt(c)*m;
  renderCard(entry);
}

// =====================
// DROPDOWN SELECT (fixed position, renders on body)
// =====================
function openSelect(btnEl,title,options,currentVal,onSelect){
  selPanel.className="sel-panel";selPanel.innerHTML="";
  if(!options||options.length===0){
    // Try reload options
    loadOptions();
    var empty=$el("div","sel-panel-title");empty.textContent="Đang tải danh sách...";
    selPanel.appendChild(empty);
    var rect=btnEl.getBoundingClientRect();
    selPanel.style.top=rect.bottom+4+"px";
    selPanel.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-290))+"px";
    selPanel.className="sel-panel open";
    return;
  }
  // Title
  var ttl=$el("div","sel-panel-title");ttl.textContent=title;
  selPanel.appendChild(ttl);
  // Items
  options.forEach(function(opt){
    var item=$el("div","sel-item"+(opt===currentVal?" active":""));
    item.textContent=opt;
    item.addEventListener("click",function(e){
      e.stopPropagation();
      selPanel.className="sel-panel";
      onSelect(opt);
    });
    selPanel.appendChild(item);
  });
  // Position below button
  var rect=btnEl.getBoundingClientRect();
  selPanel.style.top=rect.bottom+4+"px";
  selPanel.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-290))+"px";
  selPanel.className="sel-panel open";
}

// Close dropdown on outside click
document.addEventListener("click",function(e){
  if(!selPanel.contains(e.target)&&!e.target.classList.contains("sel-btn")){
    selPanel.className="sel-panel";
  }
});

// =====================
// SINGLE CARD
// =====================
function renderCard(entry){
  var ocr=entry.ocr,map=entry.mapping,loai=entry.loai;
  var state={nganh_nghe:map.nganh_nghe,danh_muc:map.danh_muc,pttt:map.pttt};
  var card=$el("div","card");

  var hdr=$el("div","card-hdr");
  var dt=$el("span","card-date");dt.textContent="Giao dịch "+ocr.ngay;
  var bg=$el("span","badge "+(map.confidence>=80?"hi":map.confidence>=50?"lo":"no"));
  bg.textContent=map.confidence+"%"+(map.confidence>=80?" ✓":" ?");
  hdr.appendChild(dt);hdr.appendChild(bg);card.appendChild(hdr);

  var body=$el("div","card-body");
  addRow(body,"Người nhận",ocr.nguoi_nhan||"—");
  addRow(body,"Ngân hàng",ocr.ngan_hang||"—");
  addRow(body,"Nội dung",ocr.noi_dung||"—");
  var ar=addRow(body,loai==="Thu"?"Thu":"Chi",fmtAmt(ocr.so_tien)+" ₫");
  ar.querySelector(".card-val").className="card-val amount"+(loai==="Thu"?" thu":"");

  addSelectRow(body,"Ngành Nghề","nganh_nghe",state,opts.nganh_nghe||[]);
  var dmO=loai==="Thu"?(opts.danh_muc_thu||[]):(opts.danh_muc_chi||[]);
  addSelectRow(body,"Danh mục","danh_muc",state,dmO);
  addSelectRow(body,"PTTT","pttt",state,opts.pttt||[]);
  card.appendChild(body);

  var acts=$el("div","card-actions");
  var sv=$el("button","card-btn save");sv.textContent="✓ Lưu vào Sheets";
  sv.addEventListener("click",function(){
    sv.disabled=true;sv.textContent="Đang lưu...";
    saveEntries([{
      so_tien:ocr.so_tien,loai:loai,ngay_tt:ocr.ngay,
      nganh_nghe:state.nganh_nghe,danh_muc:state.danh_muc,pttt:state.pttt,
      noi_dung:ocr.noi_dung||ocr.nguoi_nhan,nguoi_nhan:ocr.nguoi_nhan
    }],sv);
  });
  var sk=$el("button","card-btn skip");sk.textContent="Bỏ qua";
  sk.addEventListener("click",function(){card.style.opacity=".3";botMsg("Đã bỏ qua.")});
  acts.appendChild(sv);acts.appendChild(sk);card.appendChild(acts);
  M.appendChild(card);scr();
}

// =====================
// SELECT BUTTON + DROPDOWN
// =====================
function addRow(parent,label,value){
  var row=$el("div","card-row");
  var l=$el("div","card-label");l.textContent=label;
  var v=$el("div","card-val");v.textContent=value;
  row.appendChild(l);row.appendChild(v);parent.appendChild(row);return row;
}

function makeSelectBtn(label,field,state,options){
  var btn=$el("button","sel-btn"+(state[field]?"":" empty"));
  btn.textContent=state[field]||"Chọn...";
  var arrow=$el("span","arrow");arrow.textContent=" ▼";btn.appendChild(arrow);
  btn.addEventListener("click",function(e){
    e.stopPropagation();
    openSelect(btn,label,options,state[field],function(val){
      state[field]=val;
      btn.textContent=val;
      var a2=$el("span","arrow");a2.textContent=" ▼";btn.appendChild(a2);
      btn.className="sel-btn";
    });
  });
  return btn;
}

function addSelectRow(parent,label,field,state,options){
  var row=$el("div","card-row");
  var l=$el("div","card-label");l.textContent=label;
  row.appendChild(l);
  row.appendChild(makeSelectBtn(label,field,state,options));
  parent.appendChild(row);
}



// =====================
// SAVE
// =====================
function saveEntries(entries,btn){
  fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({entries:entries})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.success){botMsg("✓ Đã lưu "+d.count+" giao dịch!");btn.textContent="✓ Đã lưu";btn.style.background="var(--green)"}
    else{botMsg("Lỗi: "+(d.error||""));btn.disabled=false;btn.textContent="Thử lại"}
  })
  .catch(function(e){botMsg("Lỗi: "+e);btn.disabled=false;btn.textContent="Thử lại"});
}

function fmtAmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
</script>
