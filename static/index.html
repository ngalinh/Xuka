<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuka - Trợ lý kế toán</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:linear-gradient(135deg,#faf8ff,#f0ebff,#e8f0fe);height:100vh;overflow:hidden;display:flex;justify-content:center}
.chat{width:100%;max-width:600px;height:100vh;display:flex;flex-direction:column;background:rgba(255,255,255,.3)}
.header{padding:14px 20px;background:#7c3aed;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;flex-shrink:0}
.header .dot{width:8px;height:8px;background:#4ade80;border-radius:50%}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:#fff;color:#1a1a2e;border-radius:4px 14px 14px 14px;border:1px solid #e5dff5;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.msg.bot.card{border-left:3px solid #7c3aed;background:linear-gradient(135deg,#f8f5ff,#fff)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border-radius:14px 4px 14px 14px;box-shadow:0 2px 6px rgba(124,58,237,.2)}
.msg img.preview{max-width:180px;max-height:240px;border-radius:8px;display:block}

.picker{align-self:flex-start;max-width:95%;padding:14px;background:#fff;border:1px solid #e5dff5;border-left:3px solid #7c3aed;border-radius:4px 14px 14px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fi .25s ease}
.picker h4{font-size:13px;font-weight:700;color:#7c3aed;margin:10px 0 6px}
.picker h4:first-child{margin-top:0}
.picker .opts{display:flex;flex-wrap:wrap;gap:5px}
.picker .sel{font-size:12px;color:#22c55e;font-weight:600;margin:4px 0 0}

.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;animation:fi .2s ease}
.b{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;font-family:'Inter',sans-serif;transition:all .15s}
.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.4;cursor:default;transform:none;filter:none}
.bg{background:#22c55e}.bp{background:#7c3aed}.br{background:#ef4444}.bo{background:#f59e0b}.bb{background:#3b82f6}

.bottom{padding:12px 16px;border-top:1px solid rgba(124,58,237,.08);background:rgba(255,255,255,.8);backdrop-filter:blur(8px);flex-shrink:0}
.irow{display:flex;gap:6px;align-items:center;background:#fff;border:1.5px solid #e0d4f5;border-radius:24px;padding:3px 3px 3px 12px}
.irow:focus-within{border-color:#7c3aed}
.irow input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:#1a1a2e;padding:8px 0;font-family:'Inter',sans-serif}
.irow input::placeholder{color:#a0a0b0}
.ib{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:#7c3aed;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:hover{background:#f0ebff}
.ib svg{width:20px;height:20px;fill:#7c3aed}
.sb{width:36px;height:36px;border-radius:50%;border:none;background:#7c3aed;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb:hover{background:#6d28d9}
.sb:disabled{background:#c4b5fd;cursor:not-allowed}
.sb svg{width:16px;height:16px;fill:#fff}
.hint{text-align:center;font-size:11px;color:#6b7280;margin-top:6px}
.typing{align-self:flex-start;padding:10px 14px;background:#fff;border:1px solid #e5dff5;border-radius:4px 14px 14px 14px;font-size:16px;color:#6b7280;display:flex;gap:3px}
.typing span{animation:bk 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bk{0%,60%,100%{opacity:.2}30%{opacity:1}}
</style>
</head>
<body>
<div class="chat">
  <div class="header"><span class="dot"></span> Xuka - Trợ lý kế toán</div>
  <div class="messages" id="M"></div>
  <div class="bottom">
    <div class="irow">
      <button class="ib" onclick="document.getElementById('fi').click()"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></button>
      <input type="file" id="fi" accept="image/*" style="display:none" onchange="hfu(event)">
      <input type="text" id="ti" placeholder="Nhập tin nhắn hoặc paste hình...">
      <button class="sb" id="sb" onclick="st()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <div class="hint">Paste (Ctrl+V) hoặc upload hình chuyển khoản</div>
  </div>
</div>

<script>
var S="IDLE",D={},busy=false;
var M=document.getElementById("M");
var ti=document.getElementById("ti");
var sb=document.getElementById("sb");

init();

function init(){bot("Xin chào! Tôi là Xuka - trợ lý kế toán.\nChọn Thu/Chi hoặc paste hình chuyển khoản.");startBtns();}

function startBtns(){
  var w=document.createElement("div");w.className="btns";
  w.appendChild(btn("Ghi Thu","bg",function(){usr("Ghi Thu");call("start_thu","")}));
  w.appendChild(btn("Ghi Chi","bp",function(){usr("Ghi Chi");call("start_chi","")}));
  M.appendChild(w);scr();
}

function btn(t,c,fn){var b=document.createElement("button");b.className="b "+c;b.textContent=t;b.addEventListener("click",fn);return b;}

function bot(t,card){var d=document.createElement("div");d.className="msg bot"+(card?" card":"");d.textContent=t;M.appendChild(d);scr();}
function usr(t){var d=document.createElement("div");d.className="msg user";d.textContent=t;M.appendChild(d);scr();}
function scr(){requestAnimationFrame(function(){M.scrollTop=M.scrollHeight});}

function typing(){var d=document.createElement("div");d.className="typing";d.id="typ";d.innerHTML="<span>.</span><span>.</span><span>.</span>";M.appendChild(d);scr();}
function untyp(){var e=document.getElementById("typ");if(e)e.remove();}

function bc(t,i){
  if(/^Xác nhận/.test(t))return"bg";
  if(/^Hủy|^Bỏ qua/.test(t))return"br";
  if(/^Sửa/.test(t))return"bo";
  return["bb","bp","bg","bo"][i%4];
}

function mkBtns(list,action){
  var w=document.createElement("div");w.className="btns";
  list.forEach(function(t,i){
    w.appendChild(btn(t,bc(t,i),function(){
      usr(t);
      disAll();
      call(action,t);
    }));
  });
  M.appendChild(w);scr();
}

function mkGroups(groups){
  var box=document.createElement("div");box.className="picker";

  groups.forEach(function(g){
    var h=document.createElement("h4");h.textContent=g.label;
    box.appendChild(h);

    var opts=document.createElement("div");opts.className="opts";
    g.options.forEach(function(opt,i){
      var b=btn(opt,bc(opt,i),function(){
        // Disable only this group
        var btns=opts.querySelectorAll(".b");
        for(var j=0;j<btns.length;j++){btns[j].disabled=true;}
        // Show selected
        var sel=document.createElement("div");sel.className="sel";sel.textContent="✓ "+opt;
        opts.parentNode.insertBefore(sel,opts.nextSibling);
        // Send
        call(g.action,opt);
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
  });

  M.appendChild(box);
  setTimeout(scr,50);
  setTimeout(scr,300);
}

function disAll(){
  var all=M.querySelectorAll(".b");
  for(var i=0;i<all.length;i++){all[i].disabled=true;}
}

function st(){
  var t=ti.value.trim();if(!t||busy)return;
  usr(t);ti.value="";call("input_text",t);
}
ti.addEventListener("keydown",function(e){if(e.key==="Enter")st();});

// Paste image - auto upload immediately
document.addEventListener("paste",function(e){
  if(!e.clipboardData)return;
  var items=e.clipboardData.items;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf("image")!==-1){
      e.preventDefault();
      e.stopPropagation();
      var file=items[i].getAsFile();
      if(file)upload(file);
      return;
    }
  }
});

function hfu(e){var f=e.target.files[0];if(f)upload(f);e.target.value="";}

function upload(file){
  if(busy)return;
  busy=true;sb.disabled=true;

  // 1. Read file and show preview
  var reader=new FileReader();
  reader.onload=function(e){
    var d=document.createElement("div");d.className="msg user";
    var img=document.createElement("img");img.className="preview";img.src=e.target.result;
    d.appendChild(img);M.appendChild(d);scr();

    // 2. Show typing AFTER preview
    typing();

    // 3. Upload
    var fd=new FormData();fd.append("file",file);
    fetch("/api/upload",{method:"POST",body:fd})
      .then(function(r){return r.json();})
      .then(function(data){untyp();handle(data);busy=false;sb.disabled=false;})
      .catch(function(){untyp();bot("Lỗi upload hình.");setTimeout(startBtns,600);busy=false;sb.disabled=false;});
  };
  reader.readAsDataURL(file);
}

function call(action,inp){
  if(busy)return;
  busy=true;sb.disabled=true;
  typing();
  fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:action,state:S,data:D,input:inp})})
    .then(function(r){return r.json();})
    .then(function(data){untyp();handle(data);busy=false;sb.disabled=false;})
    .catch(function(){untyp();bot("Lỗi kết nối.");setTimeout(startBtns,600);busy=false;sb.disabled=false;});
}

function handle(data){
  S=data.state;D=data.data;

  data.messages.forEach(function(m){
    var card=m.text.indexOf("\n")!==-1&&(m.text.indexOf(":")!==-1||m.text.indexOf("-")!==-1);
    bot(m.text,card);
  });

  if(data.done){S="IDLE";D={};setTimeout(startBtns,600);return;}

  if(data.button_groups&&data.button_groups.length>0){
    mkGroups(data.button_groups);
  }
  if(data.buttons&&data.buttons.length>0){
    mkBtns(data.buttons,data.button_action||"select_button");
  }
  if(data.show_input){ti.placeholder=data.input_placeholder||"Nhập tin nhắn...";ti.value="";ti.focus();}
}
</script>
</body>
</html>
